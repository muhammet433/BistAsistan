name: bist-analiz-api
runtime: node

instances:
  - name: bist-analiz-api
    kind: free
    region: fra
    dockerfile: backend/Dockerfile
    env:
      - NODE_VERSION=22.13.0
      - NODE_ENV=production
      - PORT=8000
      - TURSO_DATABASE_URL=$TURSO_DATABASE_URL
      - TURSO_AUTH_TOKEN=$TURSO_AUTH_TOKEN
    health_check:
      path: /api/health
      initial_delay_seconds: 60
      period_seconds: 30
      failure_threshold: 3
    routes:
      - path: /
        protocol: http
        port: 8000
        target_port: 8000