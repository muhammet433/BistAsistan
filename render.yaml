services:
  - type: web
    name: bist-analiz-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/bist.db
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1